services:
  app:
    build: .
    ports:
      - "9090:80"
    volumes:
      - ./raw_pastes:/app/raw_pastes:ro
      - ./data:/app/data
      - ./backend/searchterms.txt:/app/configs/searchterms.txt:ro
    environment:
      - RAW_PASTES_DIR=/app/raw_pastes
      - DB_PATH=/app/data/pastes.db
      - REINDEX_INTERVAL=86400
      - AUTH_USER=admin
      - AUTH_PASSWORD=
      # URL shown in the first-boot credentials (update if you change the port mapping)
      - PUBLIC_URL=http://localhost:9090
      - SEARCH_TERMS_FILE=/app/configs/searchterms.txt
      - INDEX_WORKERS=4
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"